[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutx"
version = "2.0.0"
description = "ScoutX — Async-first reconnaissance framework with attack chain generation, 40+ tool integration, and elite methodology support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "LO" }
]

keywords = [
  "bug-bounty",
  "reconnaissance",
  "attack-surface",
  "web-security",
  "pentesting",
  "security-research",
  "osint",
  "subdomain-enumeration",
  "endpoint-discovery",
  "async",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]

dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "httpx[http2]>=0.24.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1.0",
  "playwright>=1.35.0",
  "beautifulsoup4>=4.12.0",
  "aiosqlite>=0.19.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.5.0",
  "mypy>=1.5",
]
full = [
  "python-whois>=0.9.0",
  "mmh3>=4.0.0",
  "weasyprint>=60.0",
  "uvicorn>=0.25.0",
  "fastapi>=0.108.0",
]

[project.urls]
Homepage = "https://github.com/lo/ScoutX"
Repository = "https://github.com/lo/ScoutX"
Issues = "https://github.com/lo/ScoutX/issues"
Documentation = "https://github.com/lo/ScoutX/blob/main/docs/"

[project.scripts]
sx = "scoutx.cli.app:app"
scoutx = "scoutx.cli.app:app"

[tool.setuptools.package-data]
scoutx = [
  "templates/*.j2",
  "wordlists/*.txt",
  "assets/*.png",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scoutx", "scoutx.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
