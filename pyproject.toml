[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutx"
version = "2.0.0"
description = "ScoutX — Async-first reconnaissance framework with attack chain generation, 52-tool integration, and elite methodology support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "LO" }
]

keywords = [
  "bug-bounty",
  "reconnaissance",
  "attack-surface",
  "web-security",
  "pentesting",
  "security-research",
  "osint",
  "subdomain-enumeration",
  "endpoint-discovery",
  "async",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]

dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "httpx[http2]>=0.24.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1.0",
  "playwright>=1.35.0",
  "beautifulsoup4>=4.12.0",
  "aiosqlite>=0.19.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "anyio>=4.0",
  "ruff>=0.5.0",
  "mypy>=1.5",
  "types-PyYAML",
]
full = [
  "python-whois>=0.9.0",
  "mmh3>=4.0.0",
  "weasyprint>=60.0",
  "uvicorn>=0.25.0",
  "fastapi>=0.108.0",
]

[project.urls]
Homepage = "https://github.com/GENESIS-PROKEY/ScoutX"
Repository = "https://github.com/GENESIS-PROKEY/ScoutX"
Issues = "https://github.com/GENESIS-PROKEY/ScoutX/issues"
Documentation = "https://github.com/GENESIS-PROKEY/ScoutX/blob/main/docs/"

[project.scripts]
sx = "scoutx.cli.app:app"
scoutx = "scoutx.cli.app:app"

[tool.setuptools.package-data]
scoutx = [
  "templates/*.j2",
  "wordlists/*.txt",
  "assets/*.png",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scoutx", "scoutx.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  # Broad exceptions are INTENTIONAL in a recon framework.
  # One failed DNS lookup shouldn't crash a 200-subdomain scan.
  "BLE001",  # blind-except (Exception)
  "E501",    # line too long (we set 120 but some URLs are longer)
  "E722",    # bare except
  "F841",    # local variable assigned but never used (often intentional)
  "W605",    # invalid escape sequence (regex patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "F", "W"]  # Tests are less strict
"scoutx/chains/patterns.py" = ["E501"]  # Long OWASP URLs
"scoutx/chains/checklist.py" = ["E501"]  # Long check descriptions

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
